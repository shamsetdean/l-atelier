<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512.png">
<meta name="theme-color" content="#EFEAE0">
<title>TodoJeudi — les Phénix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atelier.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--accent:#22B89B;--accent-2:#5FD8BE;--accent-deep:#0F7A63;--accent-soft:rgba(34,184,155,.14);--accent-blob:#6FE0C6;}
.todo-intro{margin-bottom:1.6rem;}
.todo-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;font-weight:600;}
.todo-eyebrow .num{background:var(--accent);color:#fff;padding:.15rem .55rem;border-radius:var(--r-pill);font-weight:700;font-size:10px;}
.todo-title{font-family:var(--serif);font-style:italic;font-size:clamp(2.6rem,9vw,3.8rem);line-height:.9;letter-spacing:-.02em;color:var(--ink);}
.todo-title .pt{color:var(--accent);font-style:normal;}
.todo-tagline{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--muted);margin-top:.3rem;}
.todo-date{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-top:.6rem;}
.todo-list{display:flex;flex-direction:column;gap:.7rem;margin-bottom:2rem;}
.todo-item{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:1rem;border-radius:var(--r-md);padding:1.1rem 1.2rem;cursor:pointer;background:var(--glass);backdrop-filter:blur(26px) saturate(165%);-webkit-backdrop-filter:blur(26px) saturate(165%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),var(--glass-inset);transition:transform .15s;}
.todo-item:active{transform:scale(.99);}
.todo-check{width:26px;height:26px;border:2px solid var(--muted-2);border-radius:8px;flex-shrink:0;margin-top:.1rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);transition:all .2s;}
.todo-check svg{width:15px;height:15px;color:#fff;opacity:0;}
.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent);}
.todo-item.done .todo-check svg{opacity:1;}
.todo-item.done .todo-label{text-decoration:line-through;color:var(--muted);}
.todo-body{display:flex;flex-direction:column;gap:.25rem;}
.todo-label{font-family:var(--serif);font-style:italic;font-size:1.3rem;line-height:1.2;color:var(--ink);}
.todo-sub{font-size:13px;color:var(--muted);line-height:1.5;}
.todo-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:.25rem .55rem;margin-top:.4rem;width:fit-content;border-radius:var(--r-pill);border:1px solid var(--accent);color:var(--accent-deep);background:var(--accent-soft);font-weight:600;}
.todo-reset-row{text-align:right;}
.btn-reset{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.55);border:1px solid var(--glass-line);border-radius:var(--r-pill);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.6rem 1rem;cursor:pointer;transition:all .15s;font-weight:600;min-height:42px;}
.btn-reset:hover{color:#E0455E;border-color:#E0455E;}
@media(min-width:768px){.todo-label{font-size:1.35rem;}}
</style>
</head>
<body>

<div class="aurora"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<header class="atelier-header glass">
  <a class="header-logo" href="index.html"><img src="phenix-logo.png" alt=""><span class="word">les Phénix</span></a>
  <div class="header-actions">
    <a class="btn-back" href="index.html"><span data-lucide="arrow-left"></span><span data-fr="Accueil" data-es="Inicio">Accueil</span></a>
    <button class="btn-lang" id="lang-toggle" onclick="toggleLang()" title="Cambiar idioma / Changer de langue">ES</button>
  </div>
</header>

<main class="atelier-main">

  <div class="todo-intro">
    <div class="todo-eyebrow">
      <span class="num accent">09</span>
      <span data-fr="les Phénix · À préparer" data-es="les Phénix · Por preparar">les Phénix · À préparer</span>
    </div>
    <h1 class="todo-title"><span data-fr="TodoJeudi" data-es="TodoJueves">TodoJeudi</span><span class="pt">.</span></h1>
    <div class="todo-tagline">
      <span data-fr="Ce qu'on prend le temps de faire jeudi" data-es="Lo que nos tomamos el tiempo de hacer el jueves">Ce qu'on prend le temps de faire jeudi</span>
    </div>
    <div class="todo-date">
      <span data-fr="Prochaine répétition · jeudi" data-es="Próximo ensayo · jueves">Prochaine répétition · jeudi</span>
    </div>
  </div>

  <div class="todo-list" id="todo-list">

    <div class="todo-item" data-id="pasteques" onclick="toggleTodo('pasteques')">
      <div class="todo-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="todo-body">
        <span class="todo-label" data-fr="Pastèques" data-es="Sandías">Pastèques</span>
      </div>
    </div>

    <div class="todo-item" data-id="balances-voix" onclick="toggleTodo('balances-voix')">
      <div class="todo-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="todo-body">
        <span class="todo-label" data-fr="Balances voix" data-es="Pruebas de voz">Balances voix</span>
        <span class="todo-sub" data-fr="Proposer 1 segment de morceau par personne" data-es="Proponer 1 segmento de canción por persona">Proposer 1 segment de morceau par personne</span>
      </div>
    </div>

    <div class="todo-item" data-id="balance-groupe" onclick="toggleTodo('balance-groupe')">
      <div class="todo-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="todo-body">
        <span class="todo-label" data-fr="Balance groupe" data-es="Prueba de grupo">Balance groupe</span>
        <span class="todo-sub">Easy Lover</span>
      </div>
    </div>

  </div>

  <div class="todo-reset-row">
    <button class="btn-reset" onclick="resetTodos()">
      <span data-fr="↻ Réinitialiser" data-es="↻ Reiniciar">↻ Réinitialiser</span>
    </button>
  </div>

</main>

<script>
if(sessionStorage.getItem('atelier-auth')!=='1'){
  window.location.href='index.html';
}

let currentLang=localStorage.getItem('atelier-lang')||'fr';
function applyLang(){
  document.querySelectorAll('[data-fr]').forEach(el=>{
    const hasChild=el.querySelector('[data-fr]');
    if(!hasChild) el.textContent=(currentLang==='fr')?el.dataset.fr:el.dataset.es;
  });
  const btn=document.getElementById('lang-toggle');
  if(btn) btn.textContent=(currentLang==='fr')?'ES':'FR';
  document.documentElement.lang=currentLang;
}
function toggleLang(){
  currentLang=(currentLang==='fr')?'es':'fr';
  localStorage.setItem('atelier-lang',currentLang);
  applyLang();
}

const STORAGE_KEY='atelier-todojeudi-state';

function loadTodoState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveTodoState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function renderTodoState(){
  const state=loadTodoState();
  document.querySelectorAll('.todo-item').forEach(item=>{
    const id=item.dataset.id;
    item.classList.toggle('done', !!state[id]);
  });
}
function toggleTodo(id){
  const state=loadTodoState();
  state[id]=!state[id];
  saveTodoState(state);
  renderTodoState();
}
function resetTodos(){
  const confirmMsg=(currentLang==='fr')
    ? 'Réinitialiser la liste TodoJeudi ?'
    : '¿Reiniciar la lista TodoJueves?';
  if(!confirm(confirmMsg)) return;
  localStorage.removeItem(STORAGE_KEY);
  renderTodoState();
}

applyLang();
renderTodoState();
</script>

<script>if(window.lucide&&lucide.createIcons)lucide.createIcons();</script>
</body>
</html>
