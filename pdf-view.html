<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Partition — les Phénix</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<style>
:root{--accent:#6A5AE0;--accent-h:#4A3CB8;--accent-l:#ECEAF6;--accent-m:#8B7BFF;--cream:#F5F3FA;--ink:#1A1726;--muted:#736E86;--surface:#FFFFFF;--border:rgba(106,90,224,.22);--borders:rgba(106,90,224,.5);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--cream);color:var(--ink);font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;}

/* HEADER */
header{background:var(--surface);border-bottom:2px solid var(--accent-m);padding:0 1rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:.75rem;min-height:calc(54px + env(safe-area-inset-top));flex-shrink:0;box-shadow:0 2px 12px rgba(106,90,224,.1);z-index:10;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;font-family:'Geist',system-ui,sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;cursor:pointer;border-radius:6px;font-weight:700;text-decoration:none;transition:background .15s;min-height:40px;}
.back-btn:hover,.back-btn:active{background:var(--accent-h);}
.page-title{flex:1;font-family:'Instrument Serif',ui-serif,Georgia,serif;font-style:italic;font-weight:700;font-size:1rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ext-btn{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Geist',system-ui,sans-serif;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer;border-radius:6px;transition:all .15s;text-decoration:none;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;gap:4px;}
.ext-btn:hover{border-color:var(--accent);color:var(--ink);}

/* ZONE PDF — scroll, pages empilées, rendues en canvas */
.pdf-wrap{flex:1;position:relative;background:#2a2a2a;overflow:auto;-webkit-overflow-scrolling:touch;}
.pdf-pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px;transform-origin:top center;transition:transform .12s ease-out;}
.pdf-page-canvas{box-shadow:0 6px 24px rgba(0,0,0,.35);background:#fff;display:block;max-width:none;}

/* CONTRÔLES ZOOM */
.zoom-controls{position:fixed;right:14px;bottom:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20;}
.zoom-btn{width:48px;height:48px;background:var(--surface);border:1.5px solid var(--borders);color:var(--accent);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .15s;padding:0;}
.zoom-btn:active{background:var(--accent);color:#fff;transform:scale(.95);}
.zoom-btn svg{width:22px;height:22px;}
.zoom-level{background:var(--surface);border:1.5px solid var(--borders);color:var(--ink);border-radius:20px;padding:6px 10px;font-size:.62rem;letter-spacing:.05em;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:700;min-width:58px;font-family:'Geist',system-ui,sans-serif;}

/* LOADER */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:var(--muted);background:var(--cream);z-index:5;pointer-events:none;transition:opacity .3s;}
.loader.hidden{opacity:0;}
.loader-spinner{width:40px;height:40px;border:3px solid var(--accent-m);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{font-family:'Instrument Serif',ui-serif,Georgia,serif;font-style:italic;color:var(--accent);font-size:1.1rem;}
.loader-hint{font-size:.65rem;color:var(--muted);letter-spacing:.08em;}

/* FALLBACK */
.fallback{display:none;position:absolute;inset:0;background:var(--cream);padding:2rem;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:1.25rem;z-index:6;}
.fallback.visible{display:flex;}
.fallback h2{font-family:'Instrument Serif',ui-serif,Georgia,serif;font-style:italic;color:var(--accent);font-size:1.5rem;}
.fallback p{font-size:.8rem;line-height:1.7;color:var(--ink);max-width:420px;}
.fallback .btn-open{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:.9rem 2rem;font-family:'Instrument Serif',ui-serif,Georgia,serif;font-style:italic;font-weight:700;font-size:1.05rem;border-radius:8px;}

/* TIP */
.zoom-tip{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(28,18,0,.85);color:#FFD080;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:20px;z-index:15;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);}
.zoom-tip.visible{opacity:1;}

@media(max-width:640px){
  header{gap:.5rem;padding:0 .75rem;padding-top:env(safe-area-inset-top);}
  .back-btn{padding:10px 12px;font-size:.62rem;}
  .back-btn .back-label-full{display:none;}
  .page-title{font-size:.85rem;}
  .ext-btn{font-size:.55rem;padding:8px 10px;}
  .ext-btn .ext-label-full{display:none;}
}
</style>
</head>
<body>

<script>
if(sessionStorage.getItem('atelier-auth')!=='1'){
  window.location.replace('index.html');
}
</script>

<header>
  <a class="back-btn" href="#" id="back-btn" aria-label="Retour">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span class="back-label-full">Retour</span>
  </a>
  <div class="page-title" id="page-title">Partition</div>
  <a class="ext-btn" id="ext-btn" href="#" target="_blank" rel="noopener" aria-label="Ouvrir dans un nouvel onglet">
    <span>↗</span>
    <span class="ext-label-full">Ouvrir le fichier</span>
  </a>
</header>

<div class="pdf-wrap" id="pdf-wrap">
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Chargement…</div>
    <div class="loader-hint">Partition en cours d'affichage</div>
  </div>

  <div class="pdf-pages" id="pdf-pages"></div>

  <div class="fallback" id="fallback">
    <h2>Affichage non disponible</h2>
    <p>Impossible d'afficher ce PDF directement ici. Clique ci-dessous pour l'ouvrir dans un nouvel onglet.</p>
    <a class="btn-open" id="fallback-open" href="#" target="_blank" rel="noopener">Ouvrir le PDF ↗</a>
  </div>
</div>

<div class="zoom-tip" id="zoom-tip">Utilisez ⊕ / ⊖ pour zoomer</div>

<div class="zoom-controls" id="zoom-controls">
  <button class="zoom-btn" id="zoom-in" aria-label="Agrandir" title="Agrandir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16.7" y2="16.7"/>
    </svg>
  </button>
  <div class="zoom-level" id="zoom-level">100%</div>
  <button class="zoom-btn" id="zoom-out" aria-label="Réduire" title="Réduire">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16.7" y2="16.7"/>
    </svg>
  </button>
  <button class="zoom-btn" id="zoom-reset" aria-label="Réinitialiser 100%" title="100%">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 12 11 12"/>
    </svg>
  </button>
</div>

<script>
/* PARAMÈTRES */
const params = new URLSearchParams(window.location.search);
const pdfUrl = params.get('url');
const pdfTitle = params.get('title') || 'Partition';
const fromPage = params.get('from') || 'index.html';

/* Sécurité : on n'accepte que des URL pointant vers Dropbox — n'importe quelle
   URL externe acceptée sans contrôle serait une porte ouverte à un lien piégé. */
const ALLOWED_HOSTS = ['dl.dropboxusercontent.com', 'www.dropbox.com', 'dropbox.com'];
let urlOk = false;
if(pdfUrl){
  try{
    const parsed = new URL(pdfUrl);
    urlOk = (parsed.protocol === 'https:' || parsed.protocol === 'http:')
      && ALLOWED_HOSTS.includes(parsed.hostname);
  }catch(e){ urlOk = false; }
}
if(!urlOk){
  window.location.replace(fromPage);
}

/* Transforme une URL Dropbox en URL de contenu direct (dl.dropboxusercontent.com + raw=1)
   pour que le fetch() ci-dessous récupère les octets du PDF plutôt que la page web Dropbox. */
function toDirectPdf(url){
  if(!url) return url;
  let out = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
  out = out.replace(/[?&]dl=\d/, '');
  if(!out.includes('raw=1')){
    out += (out.includes('?') ? '&' : '?') + 'raw=1';
  }
  return out;
}

document.getElementById('page-title').textContent = pdfTitle;
document.getElementById('back-btn').href = fromPage;
document.title = pdfTitle + " — les Phénix";

const directUrl = toDirectPdf(pdfUrl);
document.getElementById('ext-btn').href = directUrl;
document.getElementById('fallback-open').href = directUrl;

const loader = document.getElementById('loader');
const fallback = document.getElementById('fallback');
const tip = document.getElementById('zoom-tip');
const pagesContainer = document.getElementById('pdf-pages');

const isMobile = window.matchMedia('(max-width:860px)').matches
              || window.matchMedia('(pointer:coarse) and (hover:none)').matches;

if(isMobile){
  setTimeout(()=>tip.classList.add('visible'), 1500);
  setTimeout(()=>tip.classList.remove('visible'), 5500);
}

function showFallback(){
  loader.classList.add('hidden');
  fallback.classList.add('visible');
  document.getElementById('zoom-controls').style.display = 'none';
}

/* ── RENDU PDF.js : on dessine chaque page en <canvas>, indépendamment
   de la façon dont Dropbox sert le fichier (inline ou en téléchargement) ── */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';

const RENDER_SCALE = 1.8; // netteté correcte sur écrans retina, ajustable

pdfjsLib.getDocument(directUrl).promise.then(async (pdf) => {
  for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: RENDER_SCALE });
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page-canvas';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = (viewport.width / RENDER_SCALE) + 'px';
    canvas.style.height = (viewport.height / RENDER_SCALE) + 'px';
    pagesContainer.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }
  loader.classList.add('hidden');
}).catch((err) => {
  console.error('Erreur de chargement du PDF', err);
  showFallback();
});

/* ZOOM — on agrandit tout le conteneur de pages via CSS transform (rapide,
   pas de re-rendu), la netteté reste bonne jusqu'à ~250% grâce à RENDER_SCALE. */
let zoom = 1;
const wrap = document.getElementById('pdf-wrap');
const zoomLevel = document.getElementById('zoom-level');

function applyZoom(){
  pagesContainer.style.transform = `scale(${zoom})`;
  zoomLevel.textContent = Math.round(zoom * 100) + '%';
}

document.getElementById('zoom-in').addEventListener('click', ()=>{
  zoom = Math.min(3, Math.round((zoom + 0.25) * 100) / 100);
  applyZoom();
});
document.getElementById('zoom-out').addEventListener('click', ()=>{
  zoom = Math.max(0.5, Math.round((zoom - 0.25) * 100) / 100);
  applyZoom();
});
document.getElementById('zoom-reset').addEventListener('click', ()=>{
  zoom = 1;
  applyZoom();
  wrap.scrollTo({top:0, left:0, behavior:'smooth'});
});

/* RETOUR */
document.getElementById('back-btn').addEventListener('click', (e)=>{
  if(window.history.length > 1){
    e.preventDefault();
    window.history.back();
  }
});
</script>

</body>
</html>
