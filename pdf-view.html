<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Partition — L'Atelier</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#E8920A;--gold-h:#C87808;--gold-l:#FFF4DC;--gold-m:#FFD080;--cream:#FFFBF2;--ink:#1C1200;--muted:#9A7A40;--surface:#FFFFFF;--border:rgba(232,146,10,.22);--borders:rgba(232,146,10,.5);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--cream);color:var(--ink);font-family:'Space Mono',monospace;display:flex;flex-direction:column;}

/* HEADER */
header{background:var(--surface);border-bottom:2px solid var(--gold-m);padding:0 1rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:.75rem;min-height:calc(54px + env(safe-area-inset-top));flex-shrink:0;box-shadow:0 2px 12px rgba(232,146,10,.1);z-index:10;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;border:none;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;cursor:pointer;border-radius:6px;font-weight:700;text-decoration:none;transition:background .15s;min-height:40px;}
.back-btn:hover,.back-btn:active{background:var(--gold-h);}
.page-title{flex:1;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1rem;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ext-btn{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer;border-radius:6px;transition:all .15s;text-decoration:none;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;gap:4px;}
.ext-btn:hover{border-color:var(--gold);color:var(--ink);}

/* ZONE PDF — scroll + overflow pour zoom */
.pdf-wrap{flex:1;position:relative;background:#2a2a2a;overflow:auto;-webkit-overflow-scrolling:touch;}
.pdf-frame{width:100%;height:100%;border:none;display:block;background:#2a2a2a;transform-origin:top left;transition:transform .1s ease-out,width .1s ease-out,height .1s ease-out;}

/* CONTRÔLES ZOOM */
.zoom-controls{position:fixed;right:14px;bottom:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20;}
.zoom-btn{width:48px;height:48px;background:var(--surface);border:1.5px solid var(--borders);color:var(--gold);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .15s;padding:0;}
.zoom-btn:active{background:var(--gold);color:#fff;transform:scale(.95);}
.zoom-btn svg{width:22px;height:22px;}
.zoom-level{background:var(--surface);border:1.5px solid var(--borders);color:var(--ink);border-radius:20px;padding:6px 10px;font-size:.62rem;letter-spacing:.05em;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:700;min-width:58px;font-family:'Space Mono',monospace;}

/* LOADER */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:var(--muted);background:var(--cream);z-index:5;pointer-events:none;transition:opacity .3s;}
.loader.hidden{opacity:0;}
.loader-spinner{width:40px;height:40px;border:3px solid var(--gold-m);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:1.1rem;}
.loader-hint{font-size:.65rem;color:var(--muted);letter-spacing:.08em;}

/* FALLBACK */
.fallback{display:none;position:absolute;inset:0;background:var(--cream);padding:2rem;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:1.25rem;z-index:6;}
.fallback.visible{display:flex;}
.fallback h2{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:1.5rem;}
.fallback p{font-size:.8rem;line-height:1.7;color:var(--ink);max-width:420px;}
.fallback .btn-open{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;padding:.9rem 2rem;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1.05rem;border-radius:8px;}

/* TIP */
.zoom-tip{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(28,18,0,.85);color:#FFD080;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:20px;z-index:15;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);}
.zoom-tip.visible{opacity:1;}

@media(max-width:640px){
  header{gap:.5rem;padding:0 .75rem;padding-top:env(safe-area-inset-top);}
  .back-btn{padding:10px 12px;font-size:.62rem;}
  .back-btn .back-label-full{display:none;}
  .page-title{font-size:.85rem;}
  .ext-btn{font-size:.55rem;padding:8px 10px;}
  .ext-btn .ext-label-full{display:none;}
}
</style>
</head>
<body>

<script>
if(sessionStorage.getItem('atelier-auth')!=='1'){
  window.location.replace('index.html');
}
</script>

<header>
  <a class="back-btn" href="#" id="back-btn" aria-label="Retour">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span class="back-label-full">Retour</span>
  </a>
  <div class="page-title" id="page-title">Partition</div>
  <a class="ext-btn" id="ext-btn" href="#" target="_blank" rel="noopener" aria-label="Ouvrir en plein écran">
    <span>↗</span>
    <span class="ext-label-full">Plein écran</span>
  </a>
</header>

<div class="pdf-wrap" id="pdf-wrap">
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Chargement…</div>
    <div class="loader-hint">Partition en cours d'affichage</div>
  </div>

  <iframe class="pdf-frame" id="pdf-frame" title="Partition PDF" allow="fullscreen"></iframe>

  <div class="fallback" id="fallback">
    <h2>Affichage non disponible</h2>
    <p>Ton navigateur ne peut pas afficher ce PDF directement. Clique ci-dessous pour l'ouvrir en plein écran.</p>
    <a class="btn-open" id="fallback-open" href="#" target="_blank" rel="noopener">Ouvrir le PDF ↗</a>
  </div>
</div>

<div class="zoom-tip" id="zoom-tip">Utilisez ⊕ / ⊖ pour zoomer</div>

<div class="zoom-controls" id="zoom-controls">
  <button class="zoom-btn" id="zoom-in" aria-label="Agrandir" title="Agrandir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16.7" y2="16.7"/>
    </svg>
  </button>
  <div class="zoom-level" id="zoom-level">100%</div>
  <button class="zoom-btn" id="zoom-out" aria-label="Réduire" title="Réduire">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16.7" y2="16.7"/>
    </svg>
  </button>
  <button class="zoom-btn" id="zoom-reset" aria-label="Réinitialiser 100%" title="100%">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 12 11 12"/>
    </svg>
  </button>
</div>

<script>
/* PARAMÈTRES */
const params = new URLSearchParams(window.location.search);
const pdfUrl = params.get('url');
const pdfTitle = params.get('title') || 'Partition';
const pdfDl = params.get('dl') || pdfUrl;
const fromPage = params.get('from') || 'index.html';

if(!pdfUrl || !/^https?:\/\//.test(pdfUrl)){
  window.location.replace(fromPage);
}

/* Transforme une URL Dropbox en URL directe du PDF (via dl.dropboxusercontent.com)
   ce qui permet au navigateur mobile d'afficher le PDF en natif avec pinch-zoom
   et pagination complète, au lieu de la webapp Dropbox qui bloque ces interactions. */
function toDirectPdf(url){
  if(!url) return url;
  let out = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
  out = out.replace(/[?&]dl=\d/, '');
  if(!out.includes('raw=1')){
    out += (out.includes('?') ? '&' : '?') + 'raw=1';
  }
  return out;
}

document.getElementById('page-title').textContent = pdfTitle;
document.getElementById('back-btn').href = fromPage;
document.title = pdfTitle + " — L'Atelier";

/* DÉTECTION MOBILE */
const isMobile = window.matchMedia('(max-width:860px)').matches
              || window.matchMedia('(pointer:coarse) and (hover:none)').matches;

/* URL à charger */
const directUrl = toDirectPdf(pdfUrl);
const finalUrl = isMobile ? directUrl : pdfUrl;

document.getElementById('ext-btn').href = directUrl;
document.getElementById('fallback-open').href = directUrl;

/* CHARGEMENT */
const iframe = document.getElementById('pdf-frame');
const loader = document.getElementById('loader');
const fallback = document.getElementById('fallback');
const tip = document.getElementById('zoom-tip');

iframe.src = finalUrl;

if(isMobile){
  setTimeout(()=>tip.classList.add('visible'), 1500);
  setTimeout(()=>tip.classList.remove('visible'), 5500);
}

const timeout = setTimeout(()=>{
  try{
    if(!iframe.contentDocument || !iframe.contentDocument.body || iframe.contentDocument.body.innerHTML === ''){
      showFallback();
    }
  }catch(e){}
  loader.classList.add('hidden');
}, 8000);

iframe.addEventListener('load', ()=>{
  clearTimeout(timeout);
  setTimeout(()=>loader.classList.add('hidden'), 400);
});

iframe.addEventListener('error', ()=>{
  clearTimeout(timeout);
  showFallback();
});

function showFallback(){
  iframe.style.display = 'none';
  loader.classList.add('hidden');
  fallback.classList.add('visible');
  document.getElementById('zoom-controls').style.display = 'none';
}

/* ZOOM
 * L'iframe est cross-origin, on ne peut pas injecter de JS dedans.
 * On applique un scale CSS + on compense width/height pour que le contenu
 * reste navigable à la souris/doigt. Le conteneur pdf-wrap a overflow:auto
 * donc on peut scroller dans le document zoomé. */
let zoom = 1;
const wrap = document.getElementById('pdf-wrap');
const zoomLevel = document.getElementById('zoom-level');

function applyZoom(){
  iframe.style.transformOrigin = 'top left';
  iframe.style.transform = `scale(${zoom})`;
  iframe.style.width = (100 / zoom) + '%';
  iframe.style.height = (100 / zoom) + '%';
  zoomLevel.textContent = Math.round(zoom * 100) + '%';
}

document.getElementById('zoom-in').addEventListener('click', ()=>{
  zoom = Math.min(3, Math.round((zoom + 0.25) * 100) / 100);
  applyZoom();
});
document.getElementById('zoom-out').addEventListener('click', ()=>{
  zoom = Math.max(0.5, Math.round((zoom - 0.25) * 100) / 100);
  applyZoom();
});
document.getElementById('zoom-reset').addEventListener('click', ()=>{
  zoom = 1;
  applyZoom();
  wrap.scrollTo({top:0, left:0, behavior:'smooth'});
});

/* RETOUR */
document.getElementById('back-btn').addEventListener('click', (e)=>{
  if(window.history.length > 1){
    e.preventDefault();
    window.history.back();
  }
});
</script>

</body>
</html>
