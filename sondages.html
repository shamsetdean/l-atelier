<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="theme-color" content="#FFF8E7">
<title>Sondages — L'Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8E7;
  --surface:#FFFCF2;
  --ink:#1C1200;
  --muted:#8B7355;
  --border:#E8DCC0;
  --gold:#B8860B;
  --gold-l:#FFF4DC;
  --gold-m:#E5C987;
  --green:#5C8A3A;
  --borders:#D4AF37;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;line-height:1.6;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1C1200 0%,#3D2914 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1.5rem;}
.login-box{background:var(--bg);border:2px solid var(--gold);border-radius:8px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(184,134,11,.3);}
.login-title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold);text-align:center;margin-bottom:.4rem;font-style:italic;}
.login-subtitle{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2rem;}
.login-box input{width:100%;padding:.9rem 1rem;border:1.5px solid var(--border);background:var(--surface);font-family:'Space Mono',monospace;font-size:.95rem;color:var(--ink);border-radius:4px;}
.login-box input:focus{outline:none;border-color:var(--gold);}
.login-box button{width:100%;margin-top:1rem;padding:.9rem;background:var(--gold);border:none;color:#FFF;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:4px;transition:background .2s;}
.login-box button:hover{background:#9A6F09;}
.login-error{color:#C03030;font-size:.7rem;text-align:center;margin-top:.8rem;min-height:1rem;}

/* ── HEADER ── */
header{background:var(--surface);border-bottom:2px solid var(--gold-m);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:sticky;top:0;z-index:100;}
.header-logo{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1.4rem;color:var(--gold);cursor:pointer;}
.header-actions{display:flex;gap:8px;align-items:center;}
.btn-back,.btn-logout{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;padding:.5rem 1rem;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:all .2s;text-decoration:none;display:inline-block;}
.btn-back:hover,.btn-logout:hover{color:var(--ink);border-color:var(--gold);}
.btn-back{color:var(--gold);border-color:var(--gold);}

/* ── MAIN ── */
main{max-width:900px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,2.8rem);color:var(--ink);margin-bottom:.4rem;}
.page-title em{color:var(--gold);font-style:italic;}
.page-subtitle{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem;}

/* ── PRENOM SETUP ── */
.prenom-banner{background:var(--gold-l);border:1.5px solid var(--gold-m);border-radius:8px;padding:1.2rem 1.5rem;margin-bottom:2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.prenom-banner-text{flex:1;min-width:200px;font-size:.85rem;color:var(--ink);}
.prenom-banner-text strong{color:var(--gold);}
.prenom-banner input{padding:.6rem .9rem;border:1.5px solid var(--border);background:var(--surface);font-family:'Space Mono',monospace;font-size:.9rem;border-radius:4px;width:160px;}
.prenom-banner button{padding:.6rem 1rem;background:var(--gold);border:none;color:#FFF;font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:4px;}
.prenom-banner-display{font-size:.85rem;color:var(--ink);}
.prenom-banner-display strong{color:var(--gold);font-weight:700;}
.prenom-change{background:none;border:none;color:var(--muted);font-family:'Space Mono',monospace;font-size:.65rem;text-decoration:underline;cursor:pointer;margin-left:.5rem;}

/* ── ADMIN BAR ── */
.admin-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:1rem;}
.admin-status{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.admin-status.is-admin{color:var(--green);}
.admin-status.is-admin::before{content:"●  ";color:var(--green);}
.btn-create{padding:.7rem 1.4rem;background:var(--gold);border:none;color:#FFF;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:4px;transition:background .2s;}
.btn-create:hover{background:#9A6F09;}
.btn-create:disabled{background:var(--border);cursor:not-allowed;color:var(--muted);}
.btn-admin-toggle{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;padding:.5rem 1rem;cursor:pointer;border-radius:4px;text-transform:uppercase;}
.btn-admin-toggle:hover{border-color:var(--gold);color:var(--ink);}

/* ── SONDAGE CARD ── */
.sondage-list{display:flex;flex-direction:column;gap:1.5rem;}
.sondage-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:1.8rem;transition:border-color .2s;}
.sondage-card:hover{border-color:var(--gold-m);}
.sondage-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.4rem;flex-wrap:wrap;}
.sondage-question{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--ink);line-height:1.3;flex:1;min-width:200px;}
.sondage-meta{font-size:.65rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:1.4rem;}
.sondage-type{display:inline-block;padding:.15rem .5rem;background:var(--gold-l);color:var(--gold);border-radius:3px;margin-right:.5rem;font-weight:700;}
.btn-delete{background:none;border:1.5px solid #C03030;color:#C03030;font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.1em;padding:.3rem .7rem;cursor:pointer;border-radius:3px;text-transform:uppercase;}
.btn-delete:hover{background:#C03030;color:#FFF;}

/* options vote */
.options-list{display:flex;flex-direction:column;gap:.6rem;}
.option-row{display:block;padding:.9rem 1.1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.option-row:hover{border-color:var(--gold-m);}
.option-row.voted{border-color:var(--gold);background:var(--gold-l);}
.option-row.disabled{cursor:default;}
.option-bar{position:absolute;inset:0;background:var(--gold-l);opacity:.5;transform-origin:left;transition:transform .5s ease-out;z-index:0;}
.option-content{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
.option-label{font-size:.95rem;color:var(--ink);}
.option-stats{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.05em;white-space:nowrap;}
.option-stats strong{color:var(--gold);}
.option-voters{font-size:.65rem;color:var(--muted);margin-top:.4rem;font-style:italic;}

/* dispo grid */
.dispo-grid{display:grid;grid-template-columns:1fr;gap:.6rem;}
.dispo-row{display:grid;grid-template-columns:1fr auto;gap:.8rem;padding:.9rem 1.1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;align-items:center;}
.dispo-date{font-size:.95rem;color:var(--ink);font-weight:700;}
.dispo-buttons{display:flex;gap:.4rem;}
.dispo-btn{padding:.4rem .8rem;border:1.5px solid var(--border);background:var(--surface);font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-radius:4px;color:var(--muted);transition:all .15s;font-weight:700;}
.dispo-btn:hover{border-color:var(--gold-m);color:var(--ink);}
.dispo-btn.active.oui{background:var(--green);color:#FFF;border-color:var(--green);}
.dispo-btn.active.non{background:#C03030;color:#FFF;border-color:#C03030;}
.dispo-btn.active.peutetre{background:var(--gold);color:#FFF;border-color:var(--gold);}
.dispo-stats{font-size:.65rem;color:var(--muted);margin-top:.3rem;font-style:italic;}

/* empty */
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);}
.empty-icon{font-family:'Playfair Display',serif;font-size:3rem;color:var(--gold-m);margin-bottom:1rem;font-style:italic;}
.empty-text{font-size:.95rem;}

/* ── MODALES ── */
.overlay{position:fixed;inset:0;background:rgba(28,18,0,.7);z-index:500;display:none;align-items:flex-start;justify-content:center;backdrop-filter:blur(4px);overflow-y:auto;padding:2rem 1rem;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:2px solid var(--borders);border-radius:12px;width:100%;max-width:560px;padding:2rem;box-shadow:0 16px 60px rgba(28,18,0,.4);max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1.5px solid var(--gold-m);}
.modal-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1.4rem;color:var(--gold);}
.modal-close{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:.65rem;padding:.4rem .8rem;cursor:pointer;border-radius:4px;}
.modal-close:hover{color:var(--ink);border-color:var(--gold);}

.form-group{margin-bottom:1.2rem;}
.form-label{display:block;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;font-weight:700;}
.form-input,.form-select,.form-textarea{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);background:var(--bg);font-family:'Space Mono',monospace;font-size:.9rem;color:var(--ink);border-radius:4px;}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);}
.form-textarea{resize:vertical;min-height:60px;}

.options-builder{display:flex;flex-direction:column;gap:.5rem;}
.option-input-row{display:flex;gap:.5rem;align-items:center;}
.option-input-row input{flex:1;}
.option-input-row button{background:none;border:1.5px solid #C03030;color:#C03030;font-family:'Space Mono',monospace;font-size:.7rem;width:32px;height:36px;cursor:pointer;border-radius:4px;}
.option-input-row button:hover{background:#C03030;color:#FFF;}
.btn-add-option{padding:.5rem 1rem;background:none;border:1.5px dashed var(--gold-m);color:var(--gold);font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:4px;margin-top:.3rem;}
.btn-add-option:hover{background:var(--gold-l);}

.modal-actions{display:flex;gap:.8rem;justify-content:flex-end;margin-top:1.8rem;padding-top:1.2rem;border-top:1px solid var(--border);}
.btn-cancel,.btn-submit{padding:.7rem 1.4rem;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:4px;}
.btn-cancel{background:none;border:1.5px solid var(--border);color:var(--muted);}
.btn-cancel:hover{border-color:var(--ink);color:var(--ink);}
.btn-submit{background:var(--gold);border:none;color:#FFF;}
.btn-submit:hover{background:#9A6F09;}

/* ── STATUS / LOADING ── */
.loading{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.85rem;}
.firebase-error{background:#FFF0F0;border:1.5px solid #C03030;color:#8B1A1A;padding:1.2rem 1.5rem;border-radius:6px;margin-bottom:2rem;font-size:.85rem;line-height:1.5;}
.firebase-error strong{display:block;margin-bottom:.4rem;font-family:'Playfair Display',serif;font-size:1rem;}

/* ── MOBILE ── */
@media(max-width:640px){
  header{padding:.8rem 1rem;}
  .header-logo{font-size:1.15rem;}
  .btn-back,.btn-logout{font-size:.55rem;padding:.4rem .7rem;}
  main{padding:1.5rem 1rem 4rem;}
  .sondage-card{padding:1.4rem;}
  .sondage-question{font-size:1.1rem;}
  .modal{padding:1.5rem;}
  .modal-title{font-size:1.2rem;}
  .dispo-row{grid-template-columns:1fr;gap:.6rem;}
  .dispo-btn{flex:1;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1 class="login-title">L'Atelier</h1>
    <div class="login-subtitle">Sondages — Accès privé</div>
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="off">
    <button onclick="checkPassword()">Entrer</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <header>
    <span class="header-logo">L'Atelier · Sondages</span>
    <div class="header-actions">
      <a class="btn-back" href="index.html">← Accueil</a>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Sondages <em>du groupe</em></h1>
    <div class="page-subtitle">Vote · Disponibilités · Décisions collectives</div>

    <!-- Prénom -->
    <div class="prenom-banner" id="prenom-banner-setup">
      <div class="prenom-banner-text">
        <strong>Bienvenue.</strong> Indique ton prénom pour pouvoir voter.
      </div>
      <input type="text" id="prenom-input" placeholder="Ton prénom" maxlength="20">
      <button onclick="savePrenom()">Valider</button>
    </div>

    <div class="prenom-banner" id="prenom-banner-display" style="display:none;">
      <div class="prenom-banner-display" style="flex:1;">
        Tu votes en tant que <strong id="prenom-display"></strong>
        <button class="prenom-change" onclick="changePrenom()">changer</button>
      </div>
    </div>

    <!-- Erreur Firebase si non configuré -->
    <div id="firebase-status"></div>

    <!-- Admin bar -->
    <div class="admin-bar">
      <div class="admin-status" id="admin-status">Mode lecture · Vote</div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        <button class="btn-admin-toggle" id="btn-admin-toggle" onclick="toggleAdmin()">Mode admin</button>
        <button class="btn-create" id="btn-create" onclick="openCreateModal()" style="display:none;">+ Nouveau sondage</button>
      </div>
    </div>

    <!-- Liste -->
    <div id="sondage-container">
      <div class="loading" id="loading">Chargement…</div>
    </div>
  </main>
</div>

<!-- MODAL ADMIN -->
<div class="overlay" id="admin-overlay" onclick="if(event.target===this)closeAdminModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Mode administrateur</span>
      <button class="modal-close" onclick="closeAdminModal()">✕ Fermer</button>
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe admin</label>
      <input type="password" class="form-input" id="admin-pwd" placeholder="••••••••" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAdminModal()">Annuler</button>
      <button class="btn-submit" onclick="checkAdminPassword()">Activer</button>
    </div>
    <div id="admin-error" style="color:#C03030;font-size:.7rem;margin-top:.8rem;text-align:center;min-height:1rem;"></div>
  </div>
</div>

<!-- MODAL CRÉATION -->
<div class="overlay" id="create-overlay" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nouveau sondage</span>
      <button class="modal-close" onclick="closeCreateModal()">✕ Fermer</button>
    </div>

    <div class="form-group">
      <label class="form-label">Type de sondage</label>
      <select class="form-select" id="new-type" onchange="updateCreateForm()">
        <option value="choix">Choix multiple (un seul vote)</option>
        <option value="ouinon">Oui / Non / Peut-être</option>
        <option value="dispo">Disponibilités sur dates</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Question</label>
      <textarea class="form-textarea" id="new-question" placeholder="Ex: Quel morceau on travaille jeudi ?"></textarea>
    </div>

    <div class="form-group" id="form-options-group">
      <label class="form-label">Options de vote</label>
      <div class="options-builder" id="options-builder"></div>
      <button class="btn-add-option" onclick="addOptionField()">+ Ajouter une option</button>
    </div>

    <div class="form-group" id="form-dates-group" style="display:none;">
      <label class="form-label">Dates proposées</label>
      <div class="options-builder" id="dates-builder"></div>
      <button class="btn-add-option" onclick="addDateField()">+ Ajouter une date</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCreateModal()">Annuler</button>
      <button class="btn-submit" onclick="createSondage()">Créer</button>
    </div>
  </div>
</div>

<!--  FIREBASE — Realtime Database                   -->
<!-- ============================================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ========================================================
   À REMPLACER par la config de TON projet Firebase Atelier
   ======================================================== */
const firebaseConfig = {
  apiKey: "REMPLACER_API_KEY",
  authDomain: "REMPLACER.firebaseapp.com",
  databaseURL: "https://REMPLACER-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "REMPLACER",
  storageBucket: "REMPLACER.appspot.com",
  messagingSenderId: "REMPLACER",
  appId: "REMPLACER"
};

let db = null;
let firebaseReady = false;

try {
  if(firebaseConfig.apiKey === "REMPLACER_API_KEY"){
    throw new Error("CONFIG_NEEDED");
  }
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  firebaseReady = true;
} catch(e){
  if(e.message === "CONFIG_NEEDED"){
    document.getElementById('firebase-status').innerHTML = `
      <div class="firebase-error">
        <strong>Configuration Firebase requise</strong>
        Pour que les sondages fonctionnent, tu dois :<br>
        1. Créer un projet sur <a href="https://console.firebase.google.com" target="_blank" style="color:var(--gold);">console.firebase.google.com</a><br>
        2. Activer Realtime Database (mode test)<br>
        3. Copier la config dans le bloc <code>firebaseConfig</code> de ce fichier (ligne ~340)<br>
        4. Définir les règles : <code>{".read": true, ".write": true}</code> en mode test
      </div>`;
  } else {
    document.getElementById('firebase-status').innerHTML = `
      <div class="firebase-error"><strong>Erreur Firebase</strong>${e.message}</div>`;
  }
}

/* exposer pour le code non-module */
window._firebase = { db, ref, push, set, onValue, remove, update, ready: firebaseReady };
</script>

<!--  APP LOGIC                                      -->
<!-- ============================================== -->
<script>
const PASSWORD_HASH="eafe984f0ef6b3614acc40e53dfe5f5814abd392f6e5f13cbb84a3f6bdda65f6"; // mot de passe site (A2193021)
const ADMIN_HASH="ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f"; // mot de passe admin (12345678)

let isAdmin = false;
let currentPrenom = null;
let sondages = {};

/* ── AUTH SITE ── */
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function checkPassword(){
  const v = document.getElementById('pwd').value;
  if(!v) return;
  const h = await sha256(v);
  if(h === PASSWORD_HASH){
    sessionStorage.setItem('atelier-auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initApp();
  } else {
    document.getElementById('login-error').textContent='Mot de passe incorrect.';
    document.getElementById('pwd').value='';
    setTimeout(()=>document.getElementById('login-error').textContent='', 3000);
  }
}
function logout(){
  sessionStorage.removeItem('atelier-auth');
  sessionStorage.removeItem('atelier-admin');
  isAdmin = false;
  location.reload();
}
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') checkPassword(); });

/* ── PRÉNOM ── */
function loadPrenom(){
  currentPrenom = localStorage.getItem('atelier-prenom') || null;
  if(currentPrenom){
    document.getElementById('prenom-banner-setup').style.display='none';
    document.getElementById('prenom-banner-display').style.display='flex';
    document.getElementById('prenom-display').textContent = currentPrenom;
  } else {
    document.getElementById('prenom-banner-setup').style.display='flex';
    document.getElementById('prenom-banner-display').style.display='none';
  }
}
function savePrenom(){
  const v = document.getElementById('prenom-input').value.trim();
  if(!v) return;
  const clean = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase();
  localStorage.setItem('atelier-prenom', clean);
  loadPrenom();
  renderSondages();
}
function changePrenom(){
  if(!confirm('Changer ton prénom ? Tes votes resteront sous l\'ancien prénom.')) return;
  localStorage.removeItem('atelier-prenom');
  loadPrenom();
}
document.getElementById('prenom-input').addEventListener('keydown', e => { if(e.key==='Enter') savePrenom(); });

/* ── ADMIN ── */
function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    sessionStorage.removeItem('atelier-admin');
    updateAdminUI();
    renderSondages();
  } else {
    document.getElementById('admin-overlay').classList.add('open');
    setTimeout(()=>document.getElementById('admin-pwd').focus(), 50);
  }
}
async function checkAdminPassword(){
  const v = document.getElementById('admin-pwd').value;
  if(!v) return;
  const h = await sha256(v);
  if(h === ADMIN_HASH){
    isAdmin = true;
    sessionStorage.setItem('atelier-admin','1');
    closeAdminModal();
    updateAdminUI();
    renderSondages();
  } else {
    document.getElementById('admin-error').textContent='Mot de passe admin incorrect.';
    document.getElementById('admin-pwd').value='';
    setTimeout(()=>document.getElementById('admin-error').textContent='', 3000);
  }
}
function closeAdminModal(){
  document.getElementById('admin-overlay').classList.remove('open');
  document.getElementById('admin-pwd').value='';
  document.getElementById('admin-error').textContent='';
}
function updateAdminUI(){
  const status = document.getElementById('admin-status');
  const toggle = document.getElementById('btn-admin-toggle');
  const create = document.getElementById('btn-create');
  if(isAdmin){
    status.textContent = 'Mode administrateur actif';
    status.classList.add('is-admin');
    toggle.textContent = 'Quitter mode admin';
    create.style.display = 'inline-block';
  } else {
    status.textContent = 'Mode lecture · Vote';
    status.classList.remove('is-admin');
    toggle.textContent = 'Mode admin';
    create.style.display = 'none';
  }
}
document.getElementById('admin-pwd').addEventListener('keydown', e => { if(e.key==='Enter') checkAdminPassword(); });

/* ── CRÉATION SONDAGE ── */
function openCreateModal(){
  document.getElementById('create-overlay').classList.add('open');
  document.getElementById('new-question').value = '';
  document.getElementById('options-builder').innerHTML = '';
  document.getElementById('dates-builder').innerHTML = '';
  addOptionField(); addOptionField();
  addDateField();
  document.getElementById('new-type').value = 'choix';
  updateCreateForm();
}
function closeCreateModal(){
  document.getElementById('create-overlay').classList.remove('open');
}
function updateCreateForm(){
  const type = document.getElementById('new-type').value;
  document.getElementById('form-options-group').style.display = (type === 'dispo') ? 'none' : 'block';
  document.getElementById('form-dates-group').style.display = (type === 'dispo') ? 'block' : 'none';
}
function addOptionField(value = ''){
  const div = document.createElement('div');
  div.className = 'option-input-row';
  div.innerHTML = `<input type="text" class="form-input" placeholder="Option de vote" value="${value.replace(/"/g,'&quot;')}"><button onclick="this.parentElement.remove()" title="Supprimer">×</button>`;
  document.getElementById('options-builder').appendChild(div);
}
function addDateField(){
  const div = document.createElement('div');
  div.className = 'option-input-row';
  div.innerHTML = `<input type="text" class="form-input" placeholder="Ex: Jeudi 14 mai · 19h30"><button onclick="this.parentElement.remove()" title="Supprimer">×</button>`;
  document.getElementById('dates-builder').appendChild(div);
}
async function createSondage(){
  if(!window._firebase || !window._firebase.ready){
    alert('Firebase non configuré.'); return;
  }
  const type = document.getElementById('new-type').value;
  const question = document.getElementById('new-question').value.trim();
  if(!question){ alert('La question est requise.'); return; }

  let payload = { type, question, createdAt: Date.now(), createdBy: 'admin' };

  if(type === 'choix'){
    const opts = [...document.querySelectorAll('#options-builder input')].map(i=>i.value.trim()).filter(Boolean);
    if(opts.length < 2){ alert('Au moins 2 options.'); return; }
    payload.options = opts;
    payload.votes = {};
  } else if(type === 'ouinon'){
    payload.options = ['Oui','Non','Peut-être'];
    payload.votes = {};
  } else if(type === 'dispo'){
    const dates = [...document.querySelectorAll('#dates-builder input')].map(i=>i.value.trim()).filter(Boolean);
    if(dates.length < 1){ alert('Au moins 1 date.'); return; }
    payload.dates = dates;
    payload.dispos = {};
  }

  const { db, ref, push, set } = window._firebase;
  const newRef = push(ref(db, 'sondages'));
  await set(newRef, payload);
  closeCreateModal();
}

/* ── VOTE ── */
async function vote(sondageId, optionIndex){
  if(!currentPrenom){ alert('Indique ton prénom d\'abord.'); return; }
  if(!window._firebase || !window._firebase.ready) return;
  const { db, ref, set } = window._firebase;
  await set(ref(db, `sondages/${sondageId}/votes/${currentPrenom}`), optionIndex);
}
async function voteDispo(sondageId, dateIndex, value){
  if(!currentPrenom){ alert('Indique ton prénom d\'abord.'); return; }
  if(!window._firebase || !window._firebase.ready) return;
  const { db, ref, set } = window._firebase;
  await set(ref(db, `sondages/${sondageId}/dispos/${currentPrenom}/${dateIndex}`), value);
}
async function deleteSondage(sondageId){
  if(!isAdmin) return;
  if(!confirm('Supprimer définitivement ce sondage ?')) return;
  const { db, ref, remove } = window._firebase;
  await remove(ref(db, `sondages/${sondageId}`));
}

/* ── RENDU ── */
function renderSondages(){
  const container = document.getElementById('sondage-container');
  const ids = Object.keys(sondages);
  if(ids.length === 0){
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">∅</div>
        <div class="empty-text">Aucun sondage pour l'instant.${isAdmin ? '<br>Crée le premier avec le bouton ci-dessus.' : ''}</div>
      </div>`;
    return;
  }
  ids.sort((a,b) => (sondages[b].createdAt||0) - (sondages[a].createdAt||0));
  container.innerHTML = `<div class="sondage-list">${ids.map(id => renderCard(id, sondages[id])).join('')}</div>`;
}

function renderCard(id, s){
  const typeLabel = { choix:'Choix', ouinon:'Oui/Non', dispo:'Dispos' }[s.type] || s.type;
  const date = new Date(s.createdAt||0).toLocaleDateString('fr-FR', {day:'numeric',month:'short',year:'numeric'});
  const deleteBtn = isAdmin ? `<button class="btn-delete" onclick="deleteSondage('${id}')">Supprimer</button>` : '';

  let body = '';
  if(s.type === 'choix' || s.type === 'ouinon'){
    body = renderChoixCard(id, s);
  } else if(s.type === 'dispo'){
    body = renderDispoCard(id, s);
  }

  return `
    <div class="sondage-card">
      <div class="sondage-card-header">
        <h2 class="sondage-question">${escapeHtml(s.question)}</h2>
        ${deleteBtn}
      </div>
      <div class="sondage-meta"><span class="sondage-type">${typeLabel}</span>${date}</div>
      ${body}
    </div>`;
}

function renderChoixCard(id, s){
  const votes = s.votes || {};
  const myVote = currentPrenom ? votes[currentPrenom] : undefined;
  const counts = (s.options||[]).map((_,i) => Object.values(votes).filter(v => v === i).length);
  const total = Object.keys(votes).length;
  const votersByOption = (s.options||[]).map((_,i) => Object.entries(votes).filter(([_,v])=>v===i).map(([k])=>k));

  return `<div class="options-list">
    ${(s.options||[]).map((opt, i) => {
      const pct = total > 0 ? Math.round((counts[i]/total)*100) : 0;
      const isMyVote = myVote === i;
      const voters = votersByOption[i];
      return `
        <div class="option-row ${isMyVote ? 'voted' : ''} ${currentPrenom ? '' : 'disabled'}" ${currentPrenom ? `onclick="vote('${id}', ${i})"` : ''}>
          <div class="option-bar" style="transform:scaleX(${pct/100});"></div>
          <div class="option-content">
            <span class="option-label">${escapeHtml(opt)}${isMyVote ? ' ✓' : ''}</span>
            <span class="option-stats"><strong>${counts[i]}</strong> · ${pct}%</span>
          </div>
          ${voters.length ? `<div class="option-voters">${voters.map(escapeHtml).join(', ')}</div>` : ''}
        </div>`;
    }).join('')}
    <div class="dispo-stats" style="margin-top:.6rem;">${total} vote${total>1?'s':''}${currentPrenom ? '' : ' — saisis ton prénom pour voter'}</div>
  </div>`;
}

function renderDispoCard(id, s){
  const dispos = s.dispos || {};
  const dates = s.dates || [];
  return `<div class="dispo-grid">
    ${dates.map((d, i) => {
      const counts = { oui:0, non:0, peutetre:0 };
      const voters = { oui:[], non:[], peutetre:[] };
      Object.entries(dispos).forEach(([prenom, votes]) => {
        const v = votes && votes[i];
        if(v === 'oui'){ counts.oui++; voters.oui.push(prenom); }
        else if(v === 'non'){ counts.non++; voters.non.push(prenom); }
        else if(v === 'peutetre'){ counts.peutetre++; voters.peutetre.push(prenom); }
      });
      const myVote = currentPrenom && dispos[currentPrenom] ? dispos[currentPrenom][i] : undefined;
      const disabled = !currentPrenom;
      return `
        <div>
          <div class="dispo-row">
            <div class="dispo-date">${escapeHtml(d)}</div>
            <div class="dispo-buttons">
              <button class="dispo-btn oui ${myVote==='oui'?'active':''}" ${disabled?'disabled':''} onclick="voteDispo('${id}', ${i}, 'oui')">Oui</button>
              <button class="dispo-btn peutetre ${myVote==='peutetre'?'active':''}" ${disabled?'disabled':''} onclick="voteDispo('${id}', ${i}, 'peutetre')">?</button>
              <button class="dispo-btn non ${myVote==='non'?'active':''}" ${disabled?'disabled':''} onclick="voteDispo('${id}', ${i}, 'non')">Non</button>
            </div>
          </div>
          <div class="dispo-stats">
            ${counts.oui > 0 ? `<span style="color:var(--green);font-weight:700;">✓ ${counts.oui}</span> ${voters.oui.join(', ')}` : ''}
            ${counts.peutetre > 0 ? ` · <span style="color:var(--gold);font-weight:700;">? ${counts.peutetre}</span> ${voters.peutetre.join(', ')}` : ''}
            ${counts.non > 0 ? ` · <span style="color:#C03030;font-weight:700;">✗ ${counts.non}</span> ${voters.non.join(', ')}` : ''}
            ${counts.oui + counts.non + counts.peutetre === 0 ? '<em>Aucune réponse</em>' : ''}
          </div>
        </div>`;
    }).join('')}
    ${currentPrenom ? '' : '<div class="dispo-stats" style="margin-top:.6rem;">Saisis ton prénom pour voter</div>'}
  </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── INIT ── */
function initApp(){
  loadPrenom();
  if(sessionStorage.getItem('atelier-admin') === '1'){
    isAdmin = true;
  }
  updateAdminUI();

  if(!window._firebase || !window._firebase.ready){
    document.getElementById('loading').style.display = 'none';
    return;
  }

  const { db, ref, onValue } = window._firebase;
  onValue(ref(db, 'sondages'), snapshot => {
    sondages = snapshot.val() || {};
    document.getElementById('loading').style.display = 'none';
    renderSondages();
  });
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeCreateModal();
    closeAdminModal();
  }
});

/* boot */
if(sessionStorage.getItem('atelier-auth') === '1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  // attendre que firebase init avant d'init l'app
  setTimeout(initApp, 100);
}
</script>

</body>
</html>
